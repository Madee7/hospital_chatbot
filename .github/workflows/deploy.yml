name: Deploy to Windows server

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions → Deploy → Run workflow

concurrency:
  group: deploy-windows-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.WINDOWS_SSH_HOST || '196.219.86.38' }}
          username: ${{ secrets.WINDOWS_SSH_USER || 'Administrator' }}
          key: ${{ secrets.WINDOWS_SSH_KEY }}
          port: ${{ secrets.WINDOWS_SSH_PORT || 22 }}
          command_timeout: 15m
          request_pty: true
          debug: true
          # Remote OpenSSH DefaultShell should be PowerShell.
          # $ErrorActionPreference stops on first failure (script_stop was removed in ssh-action v1.2+).
          script: |
            $ErrorActionPreference = 'Stop'
            Set-Location 'C:\apps\hospital-chatbot'

            Write-Host '==> git sync main'
            git fetch origin
            git checkout main
            git pull origin main

            if (Test-Path '.\venv\Scripts\python.exe') {
              $py = '.\venv\Scripts\python.exe'
              $pip = '.\venv\Scripts\pip.exe'
            } elseif (Test-Path '.\.venv\Scripts\python.exe') {
              $py = '.\.venv\Scripts\python.exe'
              $pip = '.\.venv\Scripts\pip.exe'
            } else {
              throw 'Python venv not found (expected .\venv or .\.venv)'
            }

            Write-Host "==> pip install ($pip)"
            & $pip install -r requirements.txt

            Write-Host '==> alembic upgrade head'
            & $py -m alembic upgrade head

            Write-Host '==> restart HospitalChatbotBackend'
            Restart-Service HospitalChatbotBackend -Force
            Get-Service HospitalChatbotBackend

            if (Get-Service HospitalChatbotDashboard -ErrorAction SilentlyContinue) {
              Write-Host '==> restart HospitalChatbotDashboard'
              Restart-Service HospitalChatbotDashboard -Force
              Get-Service HospitalChatbotDashboard
            } else {
              Write-Host '==> HospitalChatbotDashboard not installed (optional); skip'
            }

            Write-Host '==> deploy OK'
            git rev-parse --short HEAD
